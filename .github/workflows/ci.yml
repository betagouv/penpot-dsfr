name: Continuous Integration
on:
  # TODO: enable this once Penpot SaaS has been patched for `figpot` to work
  # schedule:
  #   - cron: '0 7 * * 1' # Every monday at 7am
  workflow_dispatch: # Allow triggering this pipeline manually
env:
  NODE_OPTIONS: --max_old_space_size=4096
  NODE_VERSION: 20.15.0
  PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX: .cache/ms-playwright
concurrency:
  # Prevent parallel builds of the same branch
  group: cicd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  requirements:
    name: Synchronize design files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Export npm store directory as an environment variable
        shell: bash
        run: |
          echo "STORE_PATH=$(npm config get cache)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup npm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-npm-store-
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - uses: actions/cache@v3
        name: Setup figpot medias cache
        with:
          path: data/medias
          key: ${{ runner.os }}-figpot-medias-
          restore-keys: |
            ${{ runner.os }}-figpot-medias-

      - name: Install dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: npx @betagouv/figpot deps

      #
      # Note: we cannot perform just one command with all files since they use different exclusion patterns
      #

      - name: Synchronize beta file
        timeout-minutes: 30
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: |
          npx @betagouv/figpot document synchronize -d DwgchHaiTstmQn2GfkG5So:8580c946-af19-8023-8008-171982393cf2 \
            -l WgxeOWvxadSJu3zxu3T38J:8580c946-af19-8023-8008-171977f0f785 \
            -l buAUjcIJHylA7LPzx872ne:8580c946-af19-8023-8008-17197d548299 \
            -l fMUBQGfKFzsvlEoryc4owQ:8580c946-af19-8023-8008-1719801c9ba4 \
            --exclude-page-pattern='Bienvenue$' \
            --exclude-node-pattern='^⚙️ Symboles$' \
            --exclude-node-pattern='^🚫 Éléments$' \
            --exclude-node-pattern='- Introduction - Thème clair' \
            --exclude-node-pattern='• Introduction •' \
            --exclude-node-pattern='Thème sombre' \
            --exclude-node-pattern='sombre$' \
            --exclude-node-pattern='Thème=Sombre' \
            --exclude-node-pattern='• Desktop • Thème clair' \
            --exclude-node-pattern='• Mobile • Thème clair' \
            --exclude-node-pattern='• Desktop et mobile • Thème clair' \
            --exclude-node-pattern='^🚫 /' \
            --exclude-component-pattern='Thème sombre' \
            --exclude-component-pattern='Thème=Sombre' \
            --exclude-typography-pattern='^Dark' \
            --exclude-color-pattern='^Dark' \
            --replace-font-pattern='^Marianne :Marianne' \
            --sync-mapping-with-git \
            --ci

      - name: Synchronize components file
        timeout-minutes: 30
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: |
          npx @betagouv/figpot document synchronize -d fMUBQGfKFzsvlEoryc4owQ:8580c946-af19-8023-8008-1719801c9ba4 \
            -l buAUjcIJHylA7LPzx872ne:8580c946-af19-8023-8008-17197d548299 \
            -l WgxeOWvxadSJu3zxu3T38J:8580c946-af19-8023-8008-171977f0f785 \
            --exclude-page-pattern='Bienvenue$' \
            --exclude-page-pattern='Espace de travail$' \
            --exclude-node-pattern='^⚙️ Symboles$' \
            --exclude-node-pattern='^🚫 Éléments$' \
            --exclude-node-pattern='Thème sombre' \
            --exclude-node-pattern='Thème=Sombre' \
            --exclude-node-pattern='- Introduction - Thème clair' \
            --exclude-node-pattern='- Desktop - Thème clair' \
            --exclude-node-pattern='- Mobile - Thème clair' \
            --exclude-node-pattern='- Desktop et mobile - Thème clair' \
            --exclude-node-pattern='^🚫 /' \
            --exclude-component-pattern='Thème sombre' \
            --exclude-component-pattern='Thème=Sombre' \
            --exclude-typography-pattern='^Dark' \
            --exclude-color-pattern='^Dark' \
            --replace-font-pattern='^Marianne :Marianne' \
            --sync-mapping-with-git \
            --ci

      - name: Synchronize fundamentals file
        timeout-minutes: 30
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: |
          npx @betagouv/figpot document synchronize -d buAUjcIJHylA7LPzx872ne:8580c946-af19-8023-8008-17197d548299 \
            -l WgxeOWvxadSJu3zxu3T38J:8580c946-af19-8023-8008-171977f0f785 \
            --exclude-page-pattern='Bienvenue$' \
            --exclude-page-pattern='Espace de travail$' \
            --exclude-node-pattern='^⚙️ Symboles$' \
            --exclude-node-pattern='^🚫 Éléments$' \
            --exclude-node-pattern='Introduction -' \
            --exclude-node-pattern='· Introduction' \
            --exclude-node-pattern='Thème sombre' \
            --exclude-node-pattern='Sombre' \
            --exclude-node-pattern='- Desktop - Thème clair' \
            --exclude-node-pattern='- Mobile - Thème clair' \
            --exclude-node-pattern='- Desktop et mobile - Thème clair' \
            --exclude-node-pattern='- Desktop - Clair' \
            --exclude-node-pattern='- Mobile - Clair' \
            --exclude-node-pattern='- Desktop et mobile - Clair' \
            --exclude-node-pattern='(Grille|Espacements|Listes|Bloc marque) - Clair' \
            --exclude-node-pattern='^Icônes fonctionnelles · Desktop et Mobile$' \
            --exclude-node-pattern='^🚫 /' \
            --exclude-component-pattern='Thème sombre' \
            --exclude-typography-pattern='^Dark' \
            --exclude-color-pattern='^Dark' \
            --replace-font-pattern='^Marianne :Marianne' \
            --sync-mapping-with-git \
            --ci

      - name: Synchronize models file
        timeout-minutes: 30
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: |
          npx @betagouv/figpot document synchronize -d t51G87VdWvpeMLG7Vbax3t:8580c946-af19-8023-8008-1719846a7415 \
            -l WgxeOWvxadSJu3zxu3T38J:8580c946-af19-8023-8008-171977f0f785 \
            -l buAUjcIJHylA7LPzx872ne:8580c946-af19-8023-8008-17197d548299 \
            -l fMUBQGfKFzsvlEoryc4owQ:8580c946-af19-8023-8008-1719801c9ba4 \
            --exclude-page-pattern='Bienvenue$' \
            --exclude-page-pattern='Espace de travail$' \
            --exclude-node-pattern='- Introduction$' \
            --exclude-node-pattern='Thème sombre' \
            --exclude-node-pattern='Thème=Sombre' \
            --exclude-node-pattern='Sombre' \
            --exclude-node-pattern='^🚫 /' \
            --exclude-component-pattern='Thème sombre' \
            --exclude-component-pattern='Thème=Sombre' \
            --exclude-typography-pattern='^Dark' \
            --exclude-color-pattern='^Dark' \
            --replace-font-pattern='^Marianne :Marianne' \
            --sync-mapping-with-git \
            --ci

      - name: Synchronize pictograms file
        timeout-minutes: 30
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: |
          npx @betagouv/figpot document synchronize -d WgxeOWvxadSJu3zxu3T38J:8580c946-af19-8023-8008-171977f0f785 \
            -l buAUjcIJHylA7LPzx872ne:8580c946-af19-8023-8008-17197d548299 \
            --exclude-page-pattern='Lisez-moi$' \
            --replace-font-pattern='^Marianne :Marianne' \
            --sync-mapping-with-git \
            --ci
