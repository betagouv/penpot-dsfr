name: Sync the DSFR files
on:
  # TODO: enable this once Penpot SaaS has been patched for `figpot` to work
  # schedule:
  #   - cron: '0 7 * * 1' # Every monday at 7am
  workflow_dispatch: # Allow triggering this pipeline manually
env:
  NODE_OPTIONS: --max_old_space_size=12288
  NODE_VERSION: 20.15.0
  PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX: .cache/ms-playwright
  PENPOT_BASE_URL: https://penpot.systeme-de-design.gouv.fr
  FIGPOT: npx --yes @betagouv/figpot@^2
concurrency:
  # Prevent parallel builds of the same branch
  group: sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  requirements:
    name: Synchronize design files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout # zizmor: ignore[artipacked] the credentials are kept to commit the mappings back (`--sync-mapping-with-git`)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Export npm store directory as an environment variable
        shell: bash
        run: |
          echo "STORE_PATH=$(npm config get cache)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup npm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-npm-store-
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup figpot medias cache
        with:
          path: data/medias
          key: ${{ runner.os }}-figpot-medias-
          restore-keys: |
            ${{ runner.os }}-figpot-medias-

      - name: Install dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: $FIGPOT deps

      #
      # Note: files are synchronized one by one to keep the memory usage acceptable (see `scripts/synchronize.sh` for the parameters).
      # Libraries come first so the files using them can be bound right away
      #

      - name: Synchronize pictograms file
        timeout-minutes: 180
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: xvfb-run -a ./scripts/synchronize.sh pictogrammes --sync-mapping-with-git --ci

      - name: Synchronize fundamentals file
        timeout-minutes: 180
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: xvfb-run -a ./scripts/synchronize.sh fondamentaux --sync-mapping-with-git --ci

      - name: Synchronize components file
        timeout-minutes: 180
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: xvfb-run -a ./scripts/synchronize.sh composants --sync-mapping-with-git --ci

      - name: Synchronize models file
        timeout-minutes: 180
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: ./scripts/synchronize.sh modeles --sync-mapping-with-git --ci

      - name: Synchronize beta file
        timeout-minutes: 180
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          PENPOT_ACCESS_TOKEN: ${{ secrets.PENPOT_ACCESS_TOKEN }}
          PENPOT_USER_EMAIL: ${{ secrets.PENPOT_USER_EMAIL }}
          PENPOT_USER_PASSWORD: ${{ secrets.PENPOT_USER_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: xvfb-run -a ./scripts/synchronize.sh beta --sync-mapping-with-git --ci
